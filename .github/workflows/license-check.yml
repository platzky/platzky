name: License Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-check:
    name: Dependency License Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          # MIT licensed. Allow permissive licenses only.
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            CC0-1.0,
            Unlicense,
            EPL-1.0,
            EPL-2.0,
            CDDL-1.0,
            PSF-2.0
